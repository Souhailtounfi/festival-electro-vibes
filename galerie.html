
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie - Electro Vibes</title>
    <link rel="stylesheet" href="galerie.css">
</head>
<body>

    <header>
        <h1>Galerie du Festival</h1>
        <p>Revivez les meilleurs moments d'Electro Vibes !</p>
    </header>

    <main class="gallery">
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=800" alt="Concert">
            <h3>Ambiance du concert</h3>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=800" alt="Festival">
            <h3>Soirée électro</h3>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=800" alt="Public">
            <h3>Le public en fête</h3>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506157786151-b8491531f063?w=800" alt="Scène">
            <h3>Scène principale</h3>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1501612780327-45045538702b?w=800" alt="DJ">
            <h3>Performance DJ</h3>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800" alt="Événement">
            <h3>Moments inoubliables</h3>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Electro Vibes Festival</p>
    </footer>

</body>
</html>
